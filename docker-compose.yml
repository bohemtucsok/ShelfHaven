services:
  # Next.js alkalmazas (production build from source)
  app:
    build:
      context: .
      target: production
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://ebookuser:${MYSQL_PASSWORD}@db:3306/shelfhaven"
      STORAGE_DIR: "/data/storage"
      CALIBRE_SERVICE_URL: "http://calibre:8080"
      AUTH_TRUST_HOST: "true"
    # E-books and covers are stored on the host, next to this file (owner must be uid 1001)
    volumes:
      - ${STORAGE_HOST_PATH:-./storage}:/data/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      calibre:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - frontend
      - backend

  # MySQL 8.4 adatbazis
  db:
    image: mysql:8.4
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: shelfhaven
      MYSQL_USER: ebookuser
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  # Calibre - E-book konverzio (PDF/MOBI -> EPUB)
  calibre:
    build:
      context: ./docker/calibre
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - backend

volumes:
  mysql-data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
